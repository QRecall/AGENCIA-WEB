*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins',sans-serif;font-size:14px;padding-bottom:40px}
header{background:var(--dark);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 14px;position:sticky;top:0;z-index:30}
.htop{display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:700;font-size:18px;letter-spacing:.3px}
.brand span{color:#5eead4}
.hoy{background:rgba(255,255,255,.1);border-radius:20px;padding:5px 11px;font-size:11.5px;font-weight:600}
.hoy b{color:#5eead4}
.bars{display:flex;gap:4px;margin-top:12px}
.bseg{flex:1;text-align:center;background:rgba(255,255,255,.08);border-radius:7px;padding:6px 2px;cursor:pointer;border:1px solid transparent}
.bseg.on{border-color:#5eead4}
.bseg b{display:block;font-size:15px}.bseg small{font-size:8.5px;letter-spacing:.2px;color:#cbd5e1;text-transform:uppercase;line-height:1.1;display:block;margin-top:1px}
.tools{padding:10px 12px 4px;display:flex;gap:8px;flex-wrap:wrap;max-width:760px;margin:0 auto}
#q{flex:1;min-width:150px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14px;font-family:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 12px 8px;max-width:760px;margin:0 auto}
.chips button{white-space:nowrap;background:#fff;border:1px solid var(--line);color:#475569;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.chips button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
main{max-width:760px;margin:0 auto;padding:0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px}
.ctop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nom{font-weight:600;font-size:14.5px;line-height:1.25;color:var(--ink)}
.meta{color:var(--dim);font-size:12px;margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px}
.pri-Alta{background:#fef3c7;color:#b45309}.pri-Media{background:#e0e7ff;color:#4338ca}.pri-Baja{background:#f1f5f9;color:#64748b}
.web{font-size:11px;color:#dc2626;font-weight:600}
.web.ok{color:#059669}
.fijo{color:#b45309;font-weight:600}
.acts{display:flex;gap:7px;margin-top:11px;align-items:center;flex-wrap:wrap}
.acts a,.acts button{border:0;border-radius:8px;padding:9px 12px;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.wa{background:var(--wa);color:#fff}
.call{background:#e2e8f0;color:#334155}
.note-btn{background:#fff;border:1px solid var(--line)!important;color:#64748b}
select.est{margin-left:auto;border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-size:12px;font-weight:600;font-family:inherit;color:#fff}
.e0{background:#94a3b8}.e1{background:#3b82f6}.e2{background:#8b5cf6}.e3{background:#f59e0b}.e4{background:#0d9488}.e5{background:#16a34a}.e6{background:#ef4444}
.notes{margin-top:9px;display:none}
.notes.open{display:block}
.notes textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;font-family:inherit;resize:vertical;min-height:52px}
.fecha{font-size:10.5px;color:var(--dim);margin-left:2px}
.foot{max-width:760px;margin:16px auto 0;padding:0 14px}
.reglas{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:12px;color:#475569;line-height:1.6}
.reglas b{color:var(--ink)}
.io{display:flex;gap:8px;justify-content:center;margin:14px}
.io button,.io label{background:#fff;border:1px solid var(--line);color:#475569;border-radius:9px;padding:9px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
input[type=file]{display:none}
.empty{text-align:center;color:var(--dim);padding:30px;font-size:13px}
</style></head><body>

   '<div class="notes" id="nt'+l.n+'"><textarea data-nv="'+l.n+'" placeholder="Notas...">'+(s.notas||'')+'</textarea></div>'+
   '</div>';
 }).join('')||'<div class="empty">Nada en este filtro.</div>';
 document.getElementById('list').innerHTML=html;
 document.querySelectorAll('select.est').forEach(function(sel){sel.onchange=function(){var l=LEADS.find(function(x){return x.n==sel.dataset.e});var st=g(l);st.est=+sel.value;if(st.est>=1&&!st.fecha)st.fecha=today();save();render()}});
 document.querySelectorAll('.note-btn').forEach(function(b){b.onclick=function(){document.getElementById('nt'+b.dataset.nt).classList.toggle('open')}});
 document.querySelectorAll('textarea[data-nv]').forEach(function(t){t.onblur=function(){g(LEADS.find(function(x){return x.n==t.dataset.nv})).notas=t.value;save()}});
 document.querySelectorAll('.wa').forEach(function(a){a.addEventListener('click',function(){var l=LEADS.find(function(x){return x.n==a.dataset.w});var st=g(l);if(st.est===0){st.est=1;if(!st.fecha)st.fecha=today();save();setTimeout(render,300)}})});
}
document.getElementById('q').oninput=function(e){q=e.target.value.toLowerCase().trim();render()};
document.getElementById('exp').onclick=function(){var b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});var u=document.createElement('a');u.href=URL.createObjectURL(b);u.download='panel_fisios.json';u.click()};
document.getElementById('imp').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{S=JSON.parse(r.result)||{};save();render();alert('Importado ✔')}catch(x){alert('Archivo no válido')}};r.readAsText(f)};
render();
