<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blog miss-K">
<meta name="theme-color" content="#241C26">
<title>Blog miss-K</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--dark:#241C26;--gold:#BFA279;--cream:#f7f3ec;--ink:#2b2530;--dim:#8a8a8a;--line:#eee6d9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#fbf8f3;color:#404040;font-family:'Poppins',sans-serif;font-size:15px;padding-bottom:36px}
header{background:var(--dark);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 20px) 18px 18px}
.brand{font-family:'Lora',serif;font-size:23px;letter-spacing:1px}
.brand small{display:block;font-family:'Poppins';font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-top:3px}
.stats{display:flex;gap:8px;padding:14px 16px 4px;flex-wrap:wrap;max-width:720px;margin:0 auto}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px;flex:1;min-width:66px;text-align:center}
.stat b{display:block;font-size:19px;color:var(--ink);font-family:'Lora',serif}.stat small{font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim)}
.filtros{display:flex;gap:7px;flex-wrap:wrap;padding:8px 16px 12px;max-width:720px;margin:0 auto}
.filtros button{background:#fff;border:1px solid var(--line);color:#6a6a6a;border-radius:20px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer}
.filtros button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
main{max-width:720px;margin:0 auto;padding:0 16px}
.art{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:11px}
.art .tp{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.art h2{font-family:'Lora',serif;font-weight:500;font-size:16.5px;color:var(--ink);margin:0 0 4px}
.tema{display:inline-block;background:var(--cream);color:#8a6f45;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:20px}
.est{border:0;border-radius:20px;padding:7px 12px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;flex:none}
.est.idea{background:#eef0f2;color:#6a7280}.est.borrador{background:#fbf1df;color:#a9772a}.est.listo{background:#e7f4ea;color:#2e7d46}.est.publicado{background:var(--gold);color:#241C26}
.acc{margin-top:11px}
.acc button{background:#fff;border:1px solid var(--gold);color:#8a6f45;border-radius:8px;padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer}
.acc button.dis{border-color:var(--line);color:#b7b0a6;cursor:default}
.hint{color:var(--dim);font-size:12px;text-align:center;margin:14px 16px 0;line-height:1.5}
.tools{display:flex;gap:8px;justify-content:center;margin:14px}
.tools button,.tools label{background:#fff;border:1px solid var(--line);color:#6a6a6a;border-radius:9px;padding:8px 13px;font-size:12px;font-weight:600;cursor:pointer}
input[type=file]{display:none}
#ov{position:fixed;inset:0;background:#fff;z-index:100;display:none;flex-direction:column}
#ov.on{display:flex}
#ov .bar{background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;font-family:'Lora',serif}
#ov .bar button{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}
#ov iframe{flex:1;border:0;width:100%}
</style></head>
<body>
<header><div class="brand">Blog miss-K<small>lector y gestor</small></div></header>
<div class="stats" id="stats"></div>
<div class="filtros" id="filtros"></div>
<main id="lista"></main>
<p class="hint">Toca el estado para cambiarlo (idea → borrador → listo → publicado). Se guarda en tu móvil. Toca "Leer" para abrir el artículo.</p>
<div class="tools"><button id="exp">⬇ Exportar</button><label>⬆ Importar<input type="file" id="imp" accept=".json"></label></div>
<div id="ov"><div class="bar"><span id="ovt"></span><button id="ovx">✕ Cerrar</button></div><iframe id="ovf"></iframe></div>
<script>
'use strict';
const ORD=['idea','borrador','listo','publicado'],LB={idea:'Idea',borrador:'Borrador',listo:'Listo',publicado:'Publicado'};
const A=[
 {id:'althea',t:'Dr. Althea: 147 vs 345',tema:'Hidratantes',def:'publicado',url:'althea.html'},
 {id:'solar',t:'Protector solar coreano',tema:'Solar',def:'listo',url:'solar.html'},
 {id:'cosrx',t:'COSRX Advanced Snail 96',tema:'Mucina',def:'listo',url:'cosrx.html'},
 {id:'niac',t:'Niacinamida: ANUA vs COSRX',tema:'Niacinamida',def:'listo',url:'niacinamida.html'},
 {id:'centella',t:'Centella y calmantes',tema:'Calmantes',def:'borrador',url:''},
 {id:'retinol',t:'Retinol coreano, sin miedo',tema:'Antiedad',def:'borrador',url:''},
 {id:'pdrn',t:'PDRN Medicube',tema:'Regenerante',def:'borrador',url:''},
 {id:'limpieza',t:'La doble limpieza coreana',tema:'Limpieza',def:'borrador',url:''},
 {id:'manchas',t:'Niacinamida y manchas',tema:'Manchas',def:'borrador',url:''},
 {id:'pilar',t:'Rutina coreana para principiantes',tema:'Pilar',def:'idea',url:''},
];
const KEY='missk_blog_v1';let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const est=a=>S[a.id]||a.def,save=()=>localStorage.setItem(KEY,JSON.stringify(S));let filt='todos';
function stats(){const c={idea:0,borrador:0,listo:0,publicado:0};A.forEach(a=>c[est(a)]++);
 document.getElementById('stats').innerHTML='<div class="stat"><b>'+A.length+'</b><small>total</small></div><div class="stat"><b style="color:#2e7d46">'+c.publicado+'</b><small>publicados</small></div><div class="stat"><b style="color:#8a6f45">'+c.listo+'</b><small>listos</small></div><div class="stat"><b style="color:#a9772a">'+(c.borrador+c.idea)+'</b><small>por hacer</small></div>';}
function filtros(){const fs=[['todos','Todos'],['publicado','Publicados'],['listo','Listos'],['borrador','Borradores'],['idea','Ideas']];
 document.getElementById('filtros').innerHTML=fs.map(f=>'<button data-f="'+f[0]+'" class="'+(filt===f[0]?'on':'')+'">'+f[1]+'</button>').join('');
 document.querySelectorAll('#filtros button').forEach(b=>b.onclick=()=>{filt=b.dataset.f;render();});}
function render(){stats();filtros();const L=A.filter(a=>filt==='todos'||est(a)===filt);
 document.getElementById('lista').innerHTML=L.map(a=>{const e=est(a);
  const btn=a.url?'<button data-u="'+a.url+'" data-t="'+a.t+'">Leer</button>':'<button class="dis">Sin maqueta</button>';
  return '<div class="art"><div class="tp"><div><h2>'+a.t+'</h2><span class="tema">'+a.tema+'</span></div><button class="est '+e+'" data-id="'+a.id+'">'+LB[e]+'</button></div><div class="acc">'+btn+'</div></div>';}).join('')||'<p class="hint">Nada aquí.</p>';
 document.querySelectorAll('.est').forEach(b=>b.onclick=()=>{const a=A.find(x=>x.id===b.dataset.id);const c=est(a);S[a.id]=ORD[(ORD.indexOf(c)+1)%ORD.length];save();if(navigator.vibrate)navigator.vibrate(8);render();});
 document.querySelectorAll('.acc button[data-u]').forEach(b=>b.onclick=()=>{document.getElementById('ovf').src=b.dataset.u;document.getElementById('ovt').textContent=b.dataset.t;document.getElementById('ov').classList.add('on');});}
document.getElementById('ovx').onclick=()=>{document.getElementById('ov').classList.remove('on');document.getElementById('ovf').src='about:blank';};
document.getElementById('exp').onclick=()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=document.createElement('a');u.href=URL.createObjectURL(b);u.download='blog_missk.json';u.click();};
document.getElementById('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result)||{};save();render();alert('Importado ✔');}catch(x){alert('Archivo no válido');}};r.readAsText(f);};
render();
</script></body></html>
